name: Günün Ayeti — Günlük Push

on:
  schedule:
    # 08:00 UTC = 11:00 Türkiye (UTC+3). GitHub cron UTC'dir.
    - cron: '0 8 * * *'
  workflow_dispatch: {}   # Manuel test için (Actions sekmesinden "Run workflow")

permissions:
  contents: write   # banner.png'i repo'ya commit edebilmek için

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev
      - name: Günün ayetini gönder
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-daily.mjs
