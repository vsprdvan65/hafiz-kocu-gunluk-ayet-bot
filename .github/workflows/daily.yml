name: Günün Ayeti — Günlük Push

on:
  schedule:
    # 08:07 UTC = 11:07 Türkiye (UTC+3). GitHub cron UTC'dir.
    # Bilinçli olarak tam saat başı DEĞİL (dakika=7): GitHub Actions'ta
    # tam saat başları (0 8 * * * gibi) en yoğun kuyruk zamanı, bu yüzden
    # saatlerce gecikebiliyor (2026-08-27/28'de 11-12 saat gecikme görüldü).
    - cron: '7 8 * * *'
  workflow_dispatch: {}   # Manuel test için (Actions sekmesinden "Run workflow")

permissions:
  contents: write   # banner.png'i repo'ya commit edebilmek için

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev
      - name: Günün ayetini gönder
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-daily.mjs
